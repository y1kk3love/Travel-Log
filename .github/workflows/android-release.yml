name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 } # Capacitor 8 은 Java 21 로 컴파일 (keytool 은 17 이어도 됨)
      # Android SDK 는 ubuntu-latest 러너에 이미 있음 (ANDROID_HOME 설정됨). setup-android 액션은 시작 직후 실패해 뺐다.
      - run: npm ci
      - run: npm test
      - run: node scripts/build-web.js
      - run: npx cap sync android
      - run: node scripts/android-version.js "${GITHUB_REF_NAME}"
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets 가 비어 있어요:$missing — 저장소 Settings → Secrets and variables → Actions 에 등록하세요 (docs/android-signing.md)"
            exit 1
          fi
      - name: Decode keystore
        # 비밀값은 스크립트에 직접 넣지 않고 환경 변수로 넘긴다 (명령 줄·로그에 풀려 나오지 않게)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          [ -s "$RUNNER_TEMP/release.keystore" ] || { echo "::error::키 저장소 복호화 결과가 비어 있어요 (ANDROID_KEYSTORE_BASE64 값 확인)"; exit 1; }
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK and checksum
        run: |
          apk="travel-log-${GITHUB_REF_NAME#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256" # 받은 APK 가 그대로인지 확인할 수 있게
      # 쓰기 권한을 가진 외부 액션은 태그가 바뀌어도 같은 코드가 돌도록 커밋으로 고정 (v2)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            travel-log-*.apk
            travel-log-*.apk.sha256
          generate_release_notes: true
